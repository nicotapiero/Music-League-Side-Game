<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Song Guessing Game</title>
</head>
<body>

  <style>
select {
  font-size: 25px;
  padding: 12px;
  width: 100%;
  max-width: 320px;
  margin-top: 8px;
  margin-bottom: 16px;
}

body {
  font-size: 23px;
}

    /* BIG submit button */
button {
  font-size: 22px;
  padding: 18px;
  width: 100%;
  max-width: 400px;
  border: none;
  /*border-radius: 10px;*/
  /*background: #1db954;*/
  /*color: white;*/
}
</style>

<h2>Music league guess who submitted what</h2>


<div id="game">

<label>Your name:</label>
<select id="name"></select>

<hr>

<div id="songs"></div>

<br>
<button onclick="submitGuesses()">Submit</button>
</div>

<h2 id="status">Loading...</h2>

<script>

  function makeSpotifyEmbed(id) {
  return `
    <iframe
      style="border-radius:12px"
      src="https://open.spotify.com/embed/track/${id}?utm_source=generator&theme=0"
      width="100%"
      height="80"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  `;
}

const sheetId = "1JRwCEoSQD_4pLFUa_m9e6CF6aIJHztIgOtcXl36iGrY";

// GViz endpoint (READS ONLY)
const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&range=A:H`;

let players = [];
let songs = [];

async function load() {
  const res = await fetch(url);
  const text = await res.text();

  // extract JSON from GViz wrapper
  const match = text.match(/setResponse\((.*)\);/s);
  const data = JSON.parse(match[1]);

  const rows = data.table.rows.map(r =>
    r.c.map(c => (c ? c.v : null))
  );

  // assume format:
  // col0 = player name
  // col1.. = guesses or songs depending on your sheet
  players = rows.map(r => r[0]);
  songs = rows[0].slice(1);

  // populate dropdown
  const nameSelect = document.getElementById("name");
  players.forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    nameSelect.appendChild(opt);
  });

  // render songs
  const container = document.getElementById("songs");

  songs.forEach((songId, i) => {
    const div = document.createElement("div");

    const label = document.createElement("p");
    label.textContent = "Song " + (i + 1);

    const embed = document.createElement("div");
    embed.innerHTML = makeSpotifyEmbed(songId);

    const select = document.createElement("select");
    select.setAttribute("data-index", i);

    players.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = p;
      select.appendChild(opt);
    });

    div.appendChild(label);
    div.appendChild(embed);
    div.appendChild(select);
    div.appendChild(document.createElement("hr"));

    container.appendChild(div);
  });

  document.getElementById("status").style.display = "none";
}

async function submitGuesses() {
  const game = document.getElementById("game");
  const status = document.getElementById("status");

  // hide game, show loading
  game.style.display = "none";
  status.style.display = "block";
  status.textContent = "Loading...";

  try {
    const name = document.getElementById("name").value;

    const selects = document.querySelectorAll("select[data-index]");
    const guesses = Array.from(selects).map(s => s.value);

    await fetch("https://script.google.com/macros/s/AKfycbztOw6A-IinpCBJXYFjOeatl6JausQoNn2aNm4rqpYihXtNGT7XZBY7mgo1k3fju7Y/exec", {
      method: "POST",
      body: JSON.stringify({ name, guesses })
    });

    status.textContent = "Submitted — thanks! ✅";
    status.innerHTML += `<img src="https://media1.tenor.com/m/gQ5gbtPb0N0AAAAC/thanks-spongebob.gif" />`

  } catch (e) {
    status.textContent = "Something went wrong ❌";
  }
}

load();
</script>

</body>
</html>
